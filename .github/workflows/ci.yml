name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  build-jvm:
    name: JVM (shadow jar)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build shadow jar
        run: ./gradlew shadowJar

      - uses: actions/upload-artifact@v4
        with:
          name: jdbc-tester-jvm-jar
          path: build/libs/*-jvm.jar
          if-no-files-found: error

  build-native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native image
        shell: bash
        run: ./gradlew nativeCompile

      - name: Collect binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          find build/native/nativeCompile -maxdepth 1 -type f -name 'jdbc-tester-*' ! -name '*.txt' -exec cp {} dist/ \;

      - name: Collect binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build/native/nativeCompile -Filter 'jdbc-tester-*.exe' | Copy-Item -Destination dist
          Get-ChildItem -Path build/native/nativeCompile -Filter '*.dll' | Copy-Item -Destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: jdbc-tester-native-${{ matrix.name }}
          path: dist
          if-no-files-found: error
